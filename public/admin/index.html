<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Repair Requests · MALVITHA Restoration Admin</title>
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/admin/admin.css?v=1">
</head>
<body>
  <header class="ah">
    <div class="ah-in">
      <a class="ah-brand" href="/admin"><img src="/img/mark.webp" alt="" width="34" height="28"><span><b>MALVITHA</b><small>Restoration Admin</small></span></a>
      <div class="ah-me" id="me" hidden><span id="me_email"></span><button type="button" class="ab ab-o ab-sm" id="signout">Sign out</button></div>
    </div>
  </header>

  <!-- sign in -->
  <main class="login" id="login" hidden>
    <div class="card login-c">
      <img src="/img/mark.webp" alt="" width="70" height="57">
      <h1>Repair Requests</h1>
      <p>Sign in with the MALVITHA Google account to see repair requests.</p>
      <button type="button" class="ab ab-y ab-block" id="signin">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.8 3.6-4.9 6.7-4.9z"/></svg>
        Sign in with Google
      </button>
      <p class="login-err" id="login_err" role="alert"></p>
    </div>
  </main>

  <!-- requests -->
  <main class="app" id="app" hidden>
    <div class="chips" id="chips" role="tablist" aria-label="Filter by status"></div>
    <div class="tools">
      <label class="search"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search ID, name or phone" aria-label="Search requests"></label>
      <select id="fcat" aria-label="Filter by category"><option value="">All categories</option></select>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="list" id="list"></div>
  </main>

  <!-- one request -->
  <div class="ov" id="ov" hidden>
    <section class="det" id="det" role="dialog" aria-modal="true" aria-labelledby="d_id" tabindex="-1"></section>
  </div>
  <div class="lb" id="lb" hidden><button type="button" class="lb-x" aria-label="Close photo">×</button><img id="lb_img" alt=""></div>

  <p class="toast" id="toast" role="status" hidden></p>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/js/config.js?v=1"></script>
  <script src="/admin/admin.js?v=1"></script>
</body>
</html>
